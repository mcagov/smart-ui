server {
  listen 80 default_server;
  server_name service.local.smart.mcga.uk;
  return 301 https://service.local.smart.mcga.uk;
}

server {
  listen 443 default_server ssl;
  server_name service.local.smart.mcga.uk;

  include /etc/nginx/common/ssl_server.conf;

  set $smart_ui_upstream smart-ui;
  set $smart_api_upstream smart-api;
  set $smart_comments_upstream smart-commets-api;
  set $localstack localstack;

  set $debug_msg 'ui: --';

  resolver 127.0.0.11 valid=30s;

  location ~ ^/comments-docs/build-info.json {
    proxy_pass http://$smart_comments_upstream:8080/actuator/info;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/comments-docs/(v3/api-docs|swagger-ui|swagger-ui.html) {
    rewrite /comments-docs/(.*) /$1 break;
    proxy_pass http://$smart_comments_upstream:8080;
    proxy_redirect / /comments-docs/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "/comments-docs";
  }

  location ~ ^/api-docs/build-info.json {
    proxy_pass http://$smart_api_upstream:8080/actuator/info;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api-docs/(v3/api-docs|swagger-ui|swagger-ui.html) {
    rewrite /api-docs/(.*) /$1 break;
    proxy_pass http://$smart_api_upstream:8080;
    proxy_redirect / /api-docs/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "/api-docs";
  }

  location / {
    proxy_pass http://$smart_ui_upstream:${UI_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
    listen 443 ssl;
    server_name aws.local.smart.mcga.uk;

    include /etc/nginx/common/ssl_server.conf;

    set $localstack 172.17.0.1;

    set $debug_msg  'forward to localstack aws end point';

    location / {
        proxy_pass http://$localstack:4566;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

server {
    listen 443 ssl;
    server_name ~^(?<s3_bucket>.*-attachments)\.aws.local.smart.mcga.uk$;

    include /etc/nginx/common/ssl_server.conf;

    set $localstack 172.17.0.1;
    set $debug_msg  'forward to localstack bucket ${s3_bucket}';

    location / {

        proxy_pass http://$localstack:4566;
        proxy_set_header Host '${s3_bucket}.s3.eu-west-2.localhost.localstack.cloud';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($request_method ~* "(GET|POST|PUT|DELETE)") {
            add_header "Access-Control-Allow-Origin"  "https://service.local.smart.mcga.uk";
        }

        if ($request_method = OPTIONS ) {
            add_header "Access-Control-Allow-Origin"  "https://service.local.smart.mcga.uk";
            add_header "Access-Control-Allow-Methods" "PUT, POST, DELETE, OPTIONS";
            add_header "Access-Control-Allow-Headers" "*";
            return 200;
        }
    }
}

server {
  listen 443 ssl;
  server_name id.local.smart.mcga.uk;

  include /etc/nginx/common/ssl_server.conf;

  set $smart_ui_upstream smart-ui;
  set $smart_api_upstream smart-api;
  set $smart_comments_upstream smart-commets-api;
  set $localstack localstack;

  set $debug_msg 'id: --';

  resolver 127.0.0.11 valid=30s;

  location / {
    # proxy_pass http://$smart_ui_upstream:${UI_PORT};
    proxy_pass http://192.168.1.124:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

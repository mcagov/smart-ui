{% set titleText = 'View all absences' %}

{% extends "layout.html" %}

{% block content %}

<div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
        <h1 id="page-title" class="govuk-heading-l">{{titleText}}</h1>
        {% from "components/absence-table/macro.njk" import mcaAbsenceTable %}
        {{ mcaAbsenceTable({
            trainingProviderId: trainingProviderId,
            absences: absences,
            withTrainee: true
        }) }}
    </div>
</div>

{% endblock %}

{% set titleText = 'Reports'%}

{% extends "layout.html" %}
{% block content %}

<div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-xl">{{titleText}}</h1>
        <p class="govuk-body">Select a report type to generate and download.</p>

        <div class="govuk-grid-row">
            <div class="govuk-grid-column-full">
                <ul class="govuk-list">
                    <li>
                        <a href="/reports/continuing-trainee-report" class="govuk-link govuk-!-font-size-24">
                            Continuing Trainee Report
                        </a>
                        <p class="govuk-body govuk-!-margin-top-2">Generate a report of continuing trainees for a specific financial period and smart category.</p>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

{% endblock %}
